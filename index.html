<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Camara Presurizada</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100svh;
      height: 100dvh;
      min-height: 100svh;
      min-height: 100dvh;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100svh;
      height: 100dvh;
      min-height: 100svh;
      min-height: 100dvh;
      display: block;
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100svh;
      height: 100dvh;
      min-height: 100svh;
      min-height: 100dvh;
      display: block;
      background: #000;
      outline: none;
    }

    #overlay-rotar {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.92);
      color: white;
      padding: 24px;
      box-sizing: border-box;
      z-index: 50;
    }

    #overlay-rotar .contenido {
      max-width: 420px;
    }

    #overlay-rotar h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }

    #overlay-rotar p {
      margin: 0;
      line-height: 1.4;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="overlay-rotar">
    <div class="contenido">
      <h2>Gira el teléfono</h2>
      <p>
        Para jugar mejor, coloca el dispositivo en horizontal.
        Si no gira automáticamente, desactiva el bloqueo de rotación del teléfono.
      </p>
    </div>
  </div>

  <script>
    const unityCanvas = document.getElementById("unity-canvas");
    const overlayRotar = document.getElementById("overlay-rotar");

    let unityInstance = null;
    let modoJuegoHorizontalActivo = false;

    function estaHorizontal() {
      return window.innerWidth > window.innerHeight;
    }

    function actualizarOverlayRotar() {
      overlayRotar.style.display =
        (modoJuegoHorizontalActivo && !estaHorizontal()) ? "flex" : "none";
    }

    async function intentarPantallaCompletaYHorizontal() {
      try {
        if (!document.fullscreenElement && unityCanvas.requestFullscreen) {
          try {
            await unityCanvas.requestFullscreen({ navigationUI: "hide" });
          } catch (_) {
            await unityCanvas.requestFullscreen();
          }
          console.log("Fullscreen OK");
        }
      } catch (e) {
        console.warn("requestFullscreen falló:", e);
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
          console.log("orientation.lock OK");
        }
      } catch (e) {
        console.warn("orientation.lock falló:", e);
      }

      actualizarOverlayRotar();
    }

    async function salirDePantallaCompletaYDesbloquearOrientacion() {
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
          console.log("orientation.unlock OK");
        }
      } catch (e) {
        console.warn("orientation.unlock falló:", e);
      }

      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
          console.log("exitFullscreen OK");
        }
      } catch (e) {
        console.warn("exitFullscreen falló:", e);
      }

      actualizarOverlayRotar();
    }

    window.WebGL_ActivarModoJuegoHorizontal = function () {
      modoJuegoHorizontalActivo = true;
      actualizarOverlayRotar();
    };

    window.WebGL_DesactivarModoJuegoHorizontal = function () {
      modoJuegoHorizontalActivo = false;
      actualizarOverlayRotar();
      salirDePantallaCompletaYDesbloquearOrientacion();
    };

    window.WebGL_IntentarPantallaCompletaYHorizontal = function () {
      return intentarPantallaCompletaYHorizontal();
    };

    function crearConfigUnity() {
      const buildUrl = "Build";
      return {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DraegerPeruSAC",
        productName: "Camara Presurizada",
        productVersion: "0.1.0"
      };
    }

    function cargarUnity() {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "Build/WebGL.loader.js";
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("No se pudo cargar el loader de Unity."));
        document.body.appendChild(script);
      });
    }

    async function iniciarUnity() {
      try {
        await cargarUnity();
        unityInstance = await createUnityInstance(
          unityCanvas,
          crearConfigUnity(),
          function () {}
        );
        actualizarOverlayRotar();
      } catch (e) {
        console.error("No se pudo iniciar Unity:", e);
      }
    }

    window.addEventListener("resize", actualizarOverlayRotar);
    window.addEventListener("orientationchange", actualizarOverlayRotar);
    document.addEventListener("fullscreenchange", actualizarOverlayRotar);

    iniciarUnity();
  </script>
</body>
</html>
